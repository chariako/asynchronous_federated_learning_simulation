version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "06:00"
    open-pull-requests-limit: 5
    assignees:
      - chariako
    labels:
      - "dependencies"
      - "python"
      - "automerge"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      core-dependencies:
        dependency-type: "production"
      dev-dependencies:
        dependency-type: "development"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "06:00"
    open-pull-requests-limit: 5
    assignees:
      - chariako
    labels:
      - "dependencies"
      - "github-actions"
      - "automerge"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      actions-dependencies:
        patterns:
          - "*"
