version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "06:00"
    assignees:
      - chariako
    labels:
      - "dependencies"
      - "python"

    groups:
      core-dependencies:
        dependency-type: "production"

      dev-dependencies:
        dependency-type: "development"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "06:00"
    assignees:
      - chariako
    labels:
      - "dependencies"
      - "github-actions"
