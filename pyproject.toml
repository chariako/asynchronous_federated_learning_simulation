[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[project]
name = "afl-sim"
version = "0.1.0"
description = "A simulator for asynchronous federated learning."
readme = "README.md"
authors = [
    { name = "Charikleia Iakovidou", email = "chariako@u.northwestern.edu" }
]
requires-python = ">=3.12"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]

dependencies = [
    "loguru>=0.7.3",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "torch>=2.13.0",
    "torchvision>=0.24.1",
    "typer>=0.27.1",
]

[project.scripts]
afl-sim = "afl_sim.cli:app"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.1",
    "types-pyyaml>=6.0.12.20260724",
    "pre-commit>=4.6.1",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.7",
    "mkdocstrings-python>=2.0.5",
    "vulture>=2.16",
]

[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "PT", "TCH", "RUF"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = false
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

warn_unreachable = true
enable_error_code = [
    "ignore-without-code",
    "redundant-expr",
    "truthy-bool",
    "truthy-iterable",
    "unused-awaitable"
]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
module = [
    "matplotlib.*",
    "torchvision.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_decorators = false
check_untyped_defs = true
warn_return_any = false

[tool.pytest]
minversion = "9.0"
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration",
]
addopts = ["-ra", "-q", "--strict-markers", "--cov=afl_sim"]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "pass",
    "raise NotImplementedError"
]

[tool.coverage.html]
directory = "htmlcov"
